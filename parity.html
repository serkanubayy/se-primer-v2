<!doctype html><html lang="tr"><head><meta charset="UTF-8"><title>SE Primer Parite</title><script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script></head>
<body><main><h1>Web ONNX Parite Çıktısı</h1><div id="results">Yükleniyor…</div></main><script type="module">
import { predictSupport } from './src/adaptive.js';
const refs = await fetch('./tests/parite.json').then(r => r.json());
const root = document.querySelector('#results'); root.innerHTML = '';
for (const [i, ref] of refs.entries()) { const result = await predictSupport(ref.input); const row = document.createElement('p'); row.dataset.cy = `case-${i+1}`; row.dataset.p = result.p; row.dataset.expected = ref.p; row.textContent = `${i+1}: p=${result.p} expected=${ref.p} diff=${Math.abs(result.p-ref.p)}`; root.append(row); }
</script></body></html>
